<head>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

	<!-- Add style -->
	<link rel="stylesheet" type="text/css" href="style.css">	
  	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  	<link rel="stylesheet" href="style.css">

    <title>Login Page</title>
</head>
<body>
    <div class="container-navbar">
      <navbar class="navbar-investigate">
        <a href="index.html">Intrams Team</a>
        <a href="players.html">List of Players</a>
    </navbar>
    </div>

    <form>
        <div class="container">
        <p>Do you have clearance from the nurse?</p>
					<select type="rows" id="clearanceChoice" class="form-control">
							<option value="northavenue">Yes </option>
							<option value="quezonavenue">No</option>
					</select>
                    <br>
			<p>Have you completed online registry?</p>
					<select type="rows" id="teamName" class="form-control">
							<option value="northavenue">Yes</option>
							<option value="quezonavenue">No </option>
					</select>
                    <br>
            <p>What is your section?</p>
					<select type="rows" id="section" class="form-control">
							<option value="emerald">Emerald</option>
							<option value="ruby">Ruby </option>
                            <option value="sapphire">Sapphire</option>
                            <option value="topaz">Topaz</option>
					</select>
             <br>
            <p>What is your grade level</p>
					<select type="rows" id="gradelevel" class="form-control">
							<option value="seven">7</option>
							<option value="eight">8</option>
                            <option value="nine">9</option>
                            <option value="ten">10</option>
					</select>
                </form>
                <br>
                <button class="button" py-click="processForm()">Submit</button>
			</div>
	
    <div id="output"></div>
    <py-script src="main.py"></py-script>

    
</body>
</html>
